<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bank Transfer Deposit</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --text: #0f172a;
        --muted: #64748b;
        --primary: #6d5efc;
        --line: #e6eaf2;
        --danger: #ef4444;
        --ok: #16a34a;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 18px 14px 24px;
      }
      .phone {
        background: linear-gradient(180deg, #fff, #f7f9ff);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .field {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .label {
        font-size: 11px;
        color: var(--muted);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .copyrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border: 1px solid #edf1f8;
        border-radius: 12px;
        background: #fbfcff;
        cursor: pointer;
        user-select: none;
      }
      .copyval {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copybtn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        border: 1px solid #e9ecf5;
        background: #fff;
      }

      .tabs {
        display: flex;
        background: #eef2ff;
        border-radius: 14px;
        padding: 4px;
        gap: 4px;
        margin: 10px 0 14px;
        overflow-x: auto;
      }
      .tab {
        flex: 1;
        min-width: 110px;
        border: 0;
        background: transparent;
        padding: 10px 12px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 12px;
        color: #334155;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.active {
        background: linear-gradient(135deg, var(--primary), #884af6);
        color: #fff;
        box-shadow: 0 8px 18px rgba(109, 94, 252, 0.25);
      }

      .notice {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-left: 6px solid #f59e0b;
        border-radius: 14px;
        padding: 10px 12px;
        align-items: center;
        font-size: 12px;
      }
      .subtitle {
        text-align: left;
        color: #92400e;
        font-size: 11px;
        line-height: 1.4;
        margin: 6px 0px 6px;
      }

      .utrBox {
        border: 1px solid #c7d2fe;
        background: #f5f7ff;
        border-radius: 16px;
        padding: 12px;
        margin-top: 12px;
      }
      .utrTitle,
      .amountTitle {
        font-weight: 900;
        font-size: 13px;
        margin: 0 0 6px;
      }
      input {
        width: 100%;
        border: 2px solid #dbe4ff;
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #7c6bff;
        box-shadow: 0 0 0 4px rgba(124, 107, 255, 0.18);
      }
      .ok {
        border-color: rgba(22, 163, 74, 0.65) !important;
        box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12) !important;
      }
      .bad {
        border-color: rgba(239, 68, 68, 0.65) !important;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1) !important;
      }

      .utrInputRow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .utrInput {
        flex: 1;
        border: 2px solid #dbe4ff;
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
        outline: none;
      }
      .utrInput.ok {
        border-color: rgba(22, 163, 74, 0.7);
        box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.14);
      }
      .utrInput.bad {
        border-color: rgba(239, 68, 68, 0.7);
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.14);
      }
      .utrCount {
        min-width: 54px;
        text-align: right;
        font-weight: 900;
        font-size: 12px;
        color: #16a34a;
      }
      .utrCount.bad {
        color: #ef4444;
      }

      .btn {
        width: 100%;
        margin-top: 12px;
        border: 0;
        cursor: pointer;
        padding: 14px;
        border-radius: 12px;
        font-weight: 900;
        color: #fff;
        background: #cbd5e1;
        opacity: 0.7;
        font-size: 16px;
      }
      .btn.enabled {
        background: linear-gradient(135deg, var(--primary), #7c6bff);
        opacity: 1;
        box-shadow: 0 10px 20px rgba(109, 94, 252, 0.25);
      }
      .cancelBtn {
        width: 100%;
        margin-top: 10px;
        border-radius: 12px;
        background: rgba(255, 0, 0, 0.055);
        border: 1px solid #e53e3e;
        color: #e53e3e;
        padding: 14px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .hint {
        margin-top: 6px;
        margin-bottom: 6px;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.55);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.92);
        color: #fff;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
        display: none;
        z-index: 9999;
      }

      .successOverlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        background: rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .successOverlay.show {
        display: flex;
      }
      .successCard {
        width: min(420px, calc(100% - 32px));
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 18px;
        padding: 22px 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .successIcon {
        width: 54px;
        height: 54px;
        margin: 0 auto 10px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 900;
        background: rgba(34, 197, 94, 0.16);
        color: #166534;
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .successTitle {
        font-size: 18px;
        font-weight: 900;
        margin-bottom: 6px;
        color: #111827;
      }
      .successText {
        font-size: 14px;
        line-height: 1.35;
        color: #374151;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>

  <body data-method="BANK">
    <div class="wrap">
      <div class="phone">
        <div
          class="tabs"
          id="bankTabs"
          role="tablist"
          aria-label="Bank option"
        ></div>

        <div class="notice">
          <div>⚠️</div>
          <div class="subtitle" id="subtitle"></div>
        </div>

        <div class="field">
          <div class="label">Bank name</div>
          <div class="copyrow" id="copy-bankName">
            <div class="copyval" id="bankNameText">-</div>
            <div class="copybtn">⧉</div>
          </div>
        </div>

        <div class="field">
          <div class="label">Account number</div>
          <div class="copyrow" id="copy-accountNumber">
            <div class="copyval" id="accountNumberText">-</div>
            <div class="copybtn">⧉</div>
          </div>
        </div>

        <div class="field">
          <div class="label">IFSC</div>
          <div class="copyrow" id="copy-ifsc">
            <div class="copyval" id="ifscText">-</div>
            <div class="copybtn">⧉</div>
          </div>
        </div>

        <div class="field">
          <div class="label">Account holder</div>
          <div class="copyrow" id="copy-accountHolder">
            <div class="copyval" id="accountHolderText">-</div>
            <div class="copybtn">⧉</div>
          </div>
        </div>

        <form id="depositForm">
          <div class="utrBox">
            <div class="amountTitle">Amount</div>
            <div class="hint">Enter the amount you sent.</div>
            <input
              id="amount"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="Enter amount"
              autocomplete="off"
            />

            <div style="height: 10px"></div>

            <div class="utrTitle">UTR/Reference Number</div>
            <div class="utrInputRow">
              <input
                id="utr"
                class="utrInput"
                type="text"
                inputmode="numeric"
                maxlength="12"
                placeholder="Enter 12-digit UTR"
                autocomplete="off"
              />
              <div class="utrCount" id="utrCount">0/12</div>
            </div>

            <div class="notice">
              <div>⚠️</div>
              Please enter correct UTR. Wrong UTR = no credit.
            </div>

            <div class="row" style="margin-top: 10px">
              <input
                id="email"
                type="email"
                placeholder="Enter your registered email address"
                autocomplete="email"
              />
            </div>
          </div>

          <button id="submitBtn" class="btn" type="submit" disabled>
            Pay and Confirm
          </button>
          <button id="cancelBtn" type="button" class="cancelBtn">
            Cancel Payment
          </button>
        </form>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div id="successOverlay" class="successOverlay" aria-hidden="true">
      <div class="successCard">
        <div class="successIcon">✓</div>
        <div class="successTitle">Success</div>
        <div class="successText">Your request was submitted successfully.</div>
      </div>
    </div>

    <script>
      const qp = new URLSearchParams(location.search);
      const CONFIG_URL = qp.get("config") || "./config.json";
      const SUBMIT_URL =
        "https://us-central1-betvibe.cloudfunctions.net/submitDeposit";

      const $ = (id) => document.getElementById(id);

      let bankOptions = [];
      let activeBankIndex = 0;

      function showSuccessAndCloseIframe(delayMs = 600) {
        const overlay = $("successOverlay");
        overlay.classList.add("show");
        overlay.setAttribute("aria-hidden", "false");

        setTimeout(() => {
          window.parent.postMessage("closeIframe", "*");
        }, delayMs);
      }

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(toast._tm);
        toast._tm = setTimeout(() => (t.style.display = "none"), 1400);
      }

      async function copyText(text) {
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          toast("Copied");
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          toast("Copied");
        }
      }

      function validEmail(v) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      }
      function validAmount(v) {
        const n = Number(v);
        return Number.isFinite(n) && n > 0;
      }

      function validateUtr() {
        const input = $("utr");
        const count = $("utrCount");

        const raw = input.value;
        const value = raw.replace(/\D/g, "").slice(0, 12);
        input.value = value;

        count.textContent = `${value.length}/12`;

        input.classList.remove("ok", "bad");
        count.classList.remove("bad");

        if (value.length === 0) return false;

        if (value.length === 12) {
          input.classList.add("ok");
          return true;
        } else {
          input.classList.add("bad");
          count.classList.add("bad");
          return false;
        }
      }

      function updateSubmitEnabled() {
        const okUtr = validateUtr();
        const okEmail = validEmail($("email").value.trim());
        const okAmount = validAmount($("amount").value.trim());

        const btn = $("submitBtn");
        const enabled = okUtr && okEmail && okAmount;

        btn.disabled = !enabled;
        btn.classList.toggle("enabled", enabled);
      }

      function getActiveBank() {
        return bankOptions[activeBankIndex] || {};
      }

      function applyBankOption(opt) {
        $("bankNameText").textContent = opt?.bankName || "-";
        $("accountNumberText").textContent = opt?.accountNumber || "-";
        $("ifscText").textContent = opt?.ifsc || "-";
        $("accountHolderText").textContent = opt?.accountHolder || "-";
      }

      function renderBankTabs() {
        const tabs = $("bankTabs");
        tabs.innerHTML = "";

        bankOptions.forEach((opt, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "tab" + (idx === activeBankIndex ? " active" : "");
          b.textContent = opt?.label || `BANK ${idx + 1}`;
          b.addEventListener("click", () => {
            activeBankIndex = idx;

            // re-render active state
            [...tabs.querySelectorAll(".tab")].forEach((x) =>
              x.classList.remove("active")
            );
            b.classList.add("active");

            applyBankOption(getActiveBank());
          });

          tabs.appendChild(b);
        });
      }

      (async function init() {
        const res = await fetch(CONFIG_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("config load failed");
        const cfg = await res.json();

        $("cancelBtn").addEventListener("click", () => {
          window.parent.postMessage("closeIframe", "*");
        });

        // Branding (HTML allowed)
        $("subtitle").innerHTML =
          cfg?.branding?.bank?.title ||
          "Send money and submit UTR for confirmation.";

        // ✅ bankOptions preferred, fallback to cfg.bank
        const fromOptions = Array.isArray(cfg?.bankOptions)
          ? cfg.bankOptions
          : [];
        if (fromOptions.length) {
          bankOptions = fromOptions;
        } else if (cfg?.bank && typeof cfg.bank === "object") {
          bankOptions = [cfg.bank];
        } else {
          bankOptions = [{}];
        }

        activeBankIndex = 0;
        renderBankTabs();
        applyBankOption(getActiveBank());

        // Copy handlers - always copy current active bank
        $("copy-bankName").addEventListener("click", () =>
          copyText(String(getActiveBank().bankName || ""))
        );
        $("copy-accountNumber").addEventListener("click", () =>
          copyText(String(getActiveBank().accountNumber || ""))
        );
        $("copy-ifsc").addEventListener("click", () =>
          copyText(String(getActiveBank().ifsc || ""))
        );
        $("copy-accountHolder").addEventListener("click", () =>
          copyText(String(getActiveBank().accountHolder || ""))
        );

        $("utr").addEventListener("input", updateSubmitEnabled);
        $("email").addEventListener("input", updateSubmitEnabled);
        $("amount").addEventListener("input", updateSubmitEnabled);

        $("depositForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          updateSubmitEnabled();
          if ($("submitBtn").disabled) return;

          const opt = getActiveBank();
          const label = String(opt.label || `BANK ${activeBankIndex + 1}`);

          const fd = new FormData();
          fd.append("utr", $("utr").value.trim());
          fd.append("email", $("email").value.trim());

          fd.append("method", "BANK");
          fd.append("methodIndex", String(activeBankIndex));
          fd.append("methodLabel", label);

          fd.append("amount", String($("amount").value || ""));

          // Include selected bank option info
          fd.append("bankLabel", label);
          fd.append("bankName", String(opt.bankName || ""));
          fd.append("accountNumber", String(opt.accountNumber || ""));
          fd.append("ifsc", String(opt.ifsc || ""));
          fd.append("accountHolder", String(opt.accountHolder || ""));

          const btn = $("submitBtn");
          btn.disabled = true;
          btn.classList.remove("enabled");
          btn.textContent = "Submitting...";

          try {
            const r = await fetch(SUBMIT_URL, { method: "POST", body: fd });
            const data = await r.json().catch(() => ({}));
            if (!r.ok)
              throw new Error(data?.error || `Submit failed (${r.status})`);

            toast("Submitted ✅");
            btn.textContent = "Submitted";
            showSuccessAndCloseIframe();
          } catch (err) {
            console.error(err);
            toast(err?.message || "Submit error");
            btn.textContent = "Pay and Confirm";
            updateSubmitEnabled();
          }
        });

        updateSubmitEnabled();
      })().catch((e) => {
        console.error(e);
        toast("Config load error");
      });
    </script>
  </body>
</html>
